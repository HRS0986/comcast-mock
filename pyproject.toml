[project]
name = "comcast-mock"
version = "0.1.0"
description = "Mock POC backend for Comcast Kaya CX Triage"
readme = "README.md"
authors = [
    { name = "Hirusha Fernando", email = "hirusha@kayaintel.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "fastmcp>=4.0.3",
    "uvicorn>=0.52.4",
    "sqlalchemy[asyncio]>=2.0.41",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "pydantic-settings>=2.9.2",
    "python-dotenv>=1.1.0",
    "alembic>=1.16.0",
]

[dependency-groups]
dev = ["ruff>=0.11"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/comcast_mock/**/*.py" = ["B008"]

[project.scripts]
comcast-mock = "comcast_mock:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
